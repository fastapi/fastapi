name: Bump pre-commit hooks

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions: {}

env:
  UV_NO_SYNC: true

jobs:
  bump-pre-commit-hooks:
    if: github.repository_owner == 'fastapi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.FASTAPI_LATEST_CHANGES }}
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Before upgrading uv version, make sure astral-sh/setup-uv knows its checksum.
          # See: https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
          version: "0.11.30"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          cache-suffix: dev-all
          # Disable saving cache as we install narrower set of dependencies than dev-all has.
          save-cache: false
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Bump pre-commit hooks
        run: uv run prek auto-update --freeze --cooldown-days 7
      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.FASTAPI_LATEST_CHANGES }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No pre-commit hook updates available"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="bump-pre-commit-hooks"
          git switch -C "$branch"
          git add .pre-commit-config.yaml
          git commit -m "⬆ Bump pre-commit hooks"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$branch" \
              --title "⬆ Bump pre-commit hooks" \
              --body "Bump pre-commit hook versions via \`prek auto-update --freeze --cooldown-days 7\`." \
              --label internal \
              --label dependencies \
              --label pre-commit
          else
            echo "PR for \"$branch\" already open; branch updated in place."
          fi
