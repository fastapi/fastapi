name: Run tests

on:
  push:
    branches:
      - maruhsoft/utils-tests
  pull_request:
    branches:
      - maruhsoft_contribution

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install minimal dependencies
        run: |
          python -m pip install "pydantic>=2.9.0" "starlette>=0.46.0" "annotated-doc>=0.0.2" "pytest>=9.0.0" "pytest-timeout>=2.4.0"

      - name: Run tests (focused)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/tests_utils.py
